{% extends 'base.html' %}
{% block content %}
<section class="panel compact">
  <div class="section-head"><div><p class="eyebrow">Corrigir cadastro</p><h1>Editar item do estoque</h1></div></div>
  <form method="post" class="form-grid cols-2">
    <label>Item<input name="item" value="{{ item.item }}" required></label>
    <label>Categoria<input name="categoria" value="{{ item.categoria }}"></label>
    <label>Quantidade<input name="qtde" value="{{ item.qtde }}" inputmode="decimal"></label>
    <label>Preço<input name="preco" value="{{ '%.2f'|format(item.preco or 0) }}" inputmode="decimal"></label>
    <div class="actions"><button class="btn primary" type="submit">Salvar</button><a class="btn" href="{{ url_for('estoque') }}">Cancelar</a></div>
  </form>
</section>
{% endblock %}
