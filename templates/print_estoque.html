<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Estoque</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="print-page" onload="window.print()"><section class="print-sheet"><h1>Estoque da Oficina do Jairo</h1><p>Lista de itens e preços{% if q %} • filtro: {{ q }}{% endif %}</p><table><thead><tr><th>Categoria</th><th>Item</th><th>Qtd</th><th>Preço</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.categoria }}</td><td>{{ r.item }}</td><td>{{ br_int(r.qtde) }}</td><td>{{ br_money(r.preco) }}</td></tr>{% endfor %}</tbody></table></section></body></html>
