services:
  jairo-oficina:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Usa o volume antigo que já aparece no Coolify como *_mecanica-jairo-data
      # Assim os dados antigos voltam a aparecer no sistema.
      - mecanica-jairo-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - DB_PATH=/data/jairo_oficina.db
      - SECRET_KEY=troque-essa-chave-depois

volumes:
  mecanica-jairo-data:
