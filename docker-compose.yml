services:
  jairo-oficina:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Usa o banco antigo cheio encontrado no terminal: /data/oficina.db
      # Não apagar volumes antigos antes de confirmar os dados.
      - mecanica-jairo-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - DB_PATH=/data/oficina.db
      - SECRET_KEY=troque-essa-chave-depois

volumes:
  mecanica-jairo-data:
